name: PremiaLab
description: >-
  PremiaLab is a portfolio performance and risk analytics platform for
  institutional investors — asset owners, asset managers, and consultants who
  collectively manage roughly $20 trillion in assets. Its platform provides a
  quantitative strategy database of more than 7,000 single- and multi-asset
  systematic (QIS) strategies from 18 leading investment banks, position-based
  risk analytics (stress tests, sensitivities and VaR across asset classes), the
  proprietary Premialab Pure Factors model for decomposing market risk premia,
  independent price verification with daily index-level reconciliation, and
  standardized QIS Index futures offered in partnership with Eurex. PremiaLab
  exposes a client-facing REST API at api.premialab.com that is protected by an
  OAuth2 / OpenID Connect authorization server; API access is provisioned for
  institutional clients rather than through self-service developer signup. This
  profile was surfaced as a Balderton Capital portfolio company and enriched from
  PremiaLab's public web and authentication surface.
